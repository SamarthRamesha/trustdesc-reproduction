[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustdesc-phase1"
version = "0.1.0"
description = "Evidence-tracked, bounded reimplementation of TRUSTDESC"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trustdesc = "trustdesc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
