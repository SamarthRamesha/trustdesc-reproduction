[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustdesc-phase1"
version = "0.2.0"
description = "Automatic evidence-tracked independent TRUSTDESC reproduction"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
trustdesc = "trustdesc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustdesc = ["resources/*.txt"]
